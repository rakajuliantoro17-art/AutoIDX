name: AURA Trade OS - Reconcile Cron

# BACKUP DARURAT SAJA -- cron-job.org sekarang jadi trigger UTAMA
# untuk /api/cron/reconcile (terbukti sukses konsisten, lihat riwayat
# eksekusi di cron-job.org dashboard). Jadwal otomatis di sini
# SENGAJA dinonaktifkan (schedule: dikomentari) supaya tidak ada
# 2 sumber sekaligus memicu endpoint yang sama tiap 5 menit.
#
# Kalau cron-job.org down/bermasalah, workflow ini tetap bisa
# dipicu manual: tab Actions -> workflow ini -> "Run workflow".

on:
  # schedule:
  #   - cron: "*/5 * * * *"  # dinonaktifkan -- lihat catatan di atas
  workflow_dispatch: {}     # trigger manual untuk backup darurat

jobs:
  trigger-reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Call reconcile endpoint
        run: |
          curl -f -X POST https://auto-idx.vercel.app/api/cron/reconcile \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
