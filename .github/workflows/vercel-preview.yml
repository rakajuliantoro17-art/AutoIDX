name: Vercel Preview Deployment

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Deploy Preview

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Pull Preview Environment
        run: |
          vercel pull \
          --yes \
          --environment=preview \
          --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Preview
        run: |
          vercel build \
          --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Preview
        run: |
          vercel deploy \
          --prebuilt \
          --token=${{ secrets.VERCEL_TOKEN }}
