<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a11" />
    </radialGradient>

    <!-- Neon Aura Gradient -->
    <linearGradient id="aura-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glow Effect Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg-glow)" />

  <!-- Outer Tech Ring (Aura Loop) -->
  <circle cx="256" cy="230" r="150" fill="none" stroke="url(#aura-gradient)" stroke-width="6" stroke-dasharray="12 8" opacity="0.4" />
  
  <!-- Glowing Inner Circle -->
  <circle cx="256" cy="230" r="130" fill="none" stroke="url(#aura-gradient)" stroke-width="8" filter="url(#glow)" opacity="0.8" />

  <!-- Monogram A / Robot Core (Node Path) -->
  <g filter="url(#glow)">
    <!-- Left Leg -->
    <path d="M 170 320 L 256 130" stroke="url(#aura-gradient)" stroke-width="18" stroke-linecap="round" fill="none" />
    <!-- Right Leg -->
    <path d="M 256 130 L 342 320" stroke="url(#aura-gradient)" stroke-width="18" stroke-linecap="round" fill="none" />
    <!-- Center Tech Node Crossover -->
    <path d="M 200 255 L 312 255" stroke="#10b981" stroke-width="12" stroke-linecap="round" fill="none" />
  </g>

  <!-- Core Data Nodes -->
  <circle cx="256" cy="130" r="10" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="200" cy="255" r="7" fill="#10b981" />
  <circle cx="312" cy="255" r="7" fill="#10b981" />

  <!-- Typography Label -->
  <text x="256" y="415" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#ffffff" letter-spacing="4" text-anchor="middle">AURA</text>
  <text x="256" y="445" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" fill="#06b6d4" letter-spacing="6" text-anchor="middle">TRADE OS</text>
</svg>
